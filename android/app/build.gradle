plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.mshwar.appdriver"
    compileSdkVersion 36
    ndkVersion "26.1.10909125"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '11'
        freeCompilerArgs += [
            '-Xno-param-assertions',
            '-Xno-call-assertions',
            '-Xno-receiver-assertions'
        ]
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    def keystoreProperties = new Properties()
    def keystorePropertiesFile = rootProject.file('key.properties')
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    def releaseKeystore = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
    def isReleaseBuild = gradle.startParameter.taskNames.any { taskName ->
        taskName.toLowerCase().contains('release')
    }
    if (isReleaseBuild && (!releaseKeystore || !releaseKeystore.exists())) {
        throw new RuntimeException("Missing release keystore: ${releaseKeystore}. Restore the original keystore used by Google Play.")
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.mshwar.appdriver"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

     signingConfigs {
        if (releaseKeystore && releaseKeystore.exists()) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile releaseKeystore
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            if (releaseKeystore && releaseKeystore.exists()) {
                signingConfig signingConfigs.release
            }
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        checkReleaseBuilds false
        disable 'InvalidPackage'
    }

    namespace 'com.mshwar.appdriver'
}

flutter {
    source '../..'
}

dependencies {
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation "androidx.multidex:multidex:2.0.1"
    implementation 'com.stripe:stripe-wechatpay:20.16.0'
    implementation 'androidx.browser:browser:1.3.0'
    implementation 'com.google.android.play:integrity:1.3.0'
    implementation platform('com.google.firebase:firebase-bom:32.1.0')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.2'
}
